<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>横並びにする</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-2xl mx-auto px-6 py-8">

    <a href="index.html" class="text-blue-500 hover:underline text-sm">← ホームへ戻る</a>

    <h1 class="text-3xl font-bold text-gray-800 mt-4 mb-2">横並びにする</h1>
    <p class="text-gray-600 text-lg mb-8">
      カードを囲んでいる <code class="bg-gray-200 px-1 rounded">&lt;div&gt;</code> に
      <code class="bg-gray-200 px-1 rounded">flex gap-4</code> クラスを追加してみよう
    </p>

    <!-- 演習エリア -->
    <div class="border-2 border-dashed border-gray-300 bg-white rounded-xl p-8">
      <p class="text-xs text-gray-400 mb-4 font-mono">📝 演習エリア — 下の div に flex gap-4 を追加してみよう</p>

      <!-- ↓ このdivに flex gap-4 を追加してみよう -->
      <div class="">
        <div class="bg-white p-4 rounded shadow">カード 1</div>
        <div class="bg-white p-4 rounded shadow">カード 2</div>
        <div class="bg-white p-4 rounded shadow">カード 3</div>
      </div>
    </div>

  </div>
</body>
</html>
