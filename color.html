<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>色を変える</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-2xl mx-auto px-6 py-8">

    <a href="index.html" class="text-blue-500 hover:underline text-sm">← ホームへ戻る</a>

    <h1 class="text-3xl font-bold text-gray-800 mt-4 mb-2">色を変える</h1>
    <p class="text-gray-600 text-lg mb-8">
      下のテキストのクラスを <code class="bg-gray-200 px-1 rounded">text-red-500</code> から
      <code class="bg-gray-200 px-1 rounded">text-blue-600</code> に変えてみよう
    </p>

    <!-- 演習エリア -->
    <div class="border-2 border-dashed border-gray-300 bg-white rounded-xl p-8">
      <p class="text-xs text-gray-400 mb-4 font-mono">📝 演習エリア — ここのクラスを書き換えてみよう</p>

      <!-- ↓ text-red-500 を text-blue-600 に変えてみよう -->
      <h1 class="text-red-500 text-4xl font-bold">POSSE CAFE</h1>
      <p class="text-red-300">東京・渋谷のコーヒーショップ</p>
    </div>

  </div>
</body>
</html>
